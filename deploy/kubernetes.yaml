apiVersion: v1
kind: ConfigMap
metadata:
  name: browslatro-config
data:
  HOST: "0.0.0.0"
  PORT: "8080"
  PUBLIC_ORIGINS: "http://browslatro.internal"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: browslatro
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: browslatro
  template:
    metadata:
      labels:
        app: browslatro
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: browslatro
          image: registry.internal/browslatro:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: browslatro-config
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 12
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: browslatro
spec:
  selector:
    app: browslatro
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: browslatro
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: browslatro.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: browslatro
                port:
                  name: http
