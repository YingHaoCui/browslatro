services:
  browslatro:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      PUBLIC_ORIGINS: "${PUBLIC_ORIGINS:-}"
      MCP_AUTH_TOKEN: "${MCP_AUTH_TOKEN:-}"
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
